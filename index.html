<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job · Your CV, Tailored to Every Job</title>
<meta name="description" content="Upload a CV and a job ad; get a CV and cover letter tailored to that job, built to pass applicant tracking systems.">
<meta property="og:title" content="Job · Your CV, Tailored to Every Job">
<meta property="og:description" content="A CV and cover letter shaped to each job, built to pass applicant tracking systems.">
<meta property="og:url" content="https://job.appdoivo.com/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://job.appdoivo.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/job.css?v=1">
</head>
<body>
<header class="top">
  <a class="brand" href="/" data-w="brand">Job</a>
  <span class="tools">
    <button class="mode" id="mode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg></button>
    <button class="lang" id="lang" type="button">PT</button>
  </span>
</header>
<main>
  <section class="hero">
    <h1 data-w="tagline">Your CV, Tailored to Every Job</h1>
    <p class="intro" data-w="intro"></p>
  </section>

  <form id="form" class="steps" novalidate>
    <fieldset class="step">
      <legend><span class="num">1</span><span data-w="stepCv"></span></legend>
      <div class="drop" id="drop">
        <input type="file" id="cv-file" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" class="sr">
        <label for="cv-file" class="btn ghost" data-w="choose"></label>
        <span class="muted" data-w="drop"></span>
        <button type="button" class="link" id="paste-toggle" data-w="pasteInstead" aria-expanded="false" aria-controls="cv-text"></button>
      </div>
      <p class="hint" id="cv-status" aria-live="polite" data-w="cvHint"></p>
      <label class="sr" for="cv-text" data-w="cvPaste"></label>
      <textarea id="cv-text" rows="8" hidden></textarea>
    </fieldset>

    <fieldset class="step">
      <legend><span class="num">2</span><label for="job" data-w="stepJob"></label></legend>
      <textarea id="job" rows="7" required></textarea>
    </fieldset>

    <fieldset class="step">
      <legend><span class="num">3</span><label for="company" data-w="stepCompany"></label><span class="opt" data-w="optional"></span></legend>
      <p class="hint" data-w="companyHint"></p>
      <textarea id="company" rows="4"></textarea>
    </fieldset>

    <fieldset class="step options">
      <legend class="sr" data-w="colour"></legend>
      <div class="opt-row">
        <span class="opt-label" id="colour-label" data-w="colour"></span>
        <div class="swatches" role="radiogroup" aria-labelledby="colour-label" id="swatches"></div>
      </div>
      <div class="opt-row">
        <label class="opt-label" for="model" data-w="model"></label>
        <select id="model"></select>
      </div>
    </fieldset>

    <div class="go">
      <button type="submit" class="btn" id="tailor" data-w="tailor"></button>
      <button type="button" class="btn ghost" id="example" data-w="example"></button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint center" data-w="privacy"></p>
  </form>

  <dialog id="pass-dialog" class="pass">
    <form method="dialog" id="pass-form">
      <label for="pass" data-w="passcode"></label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <p class="hint" data-w="passHint"></p>
      <p class="err" id="pass-err" hidden data-w="passWrong"></p>
      <div class="go"><button class="btn" value="ok" data-w="tailor"></button></div>
    </form>
  </dialog>

  <section id="result" class="result" hidden aria-labelledby="result-title">
    <h2 class="sr" id="result-title" data-w="tabCv"></h2>
    <p class="hint" id="result-note"></p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-cv" aria-controls="panel-cv" aria-selected="true" data-w="tabCv"></button>
      <button role="tab" id="tab-letter" aria-controls="panel-letter" aria-selected="false" data-w="tabLetter"></button>
    </div>
    <div class="panel" id="panel-cv" role="tabpanel" aria-labelledby="tab-cv">
      <div class="downloads"><button type="button" class="btn" data-dl="cv-pdf" data-w="dlPdf"></button><button type="button" class="btn ghost" data-dl="cv-docx" data-w="dlWord"></button></div>
      <div class="paper-wrap" id="cv-preview"></div>
    </div>
    <div class="panel" id="panel-letter" role="tabpanel" aria-labelledby="tab-letter" hidden>
      <div class="downloads"><button type="button" class="btn" data-dl="letter-pdf" data-w="dlPdf"></button><button type="button" class="btn ghost" data-dl="letter-docx" data-w="dlWord"></button></div>
      <div class="paper-wrap" id="letter-preview"></div>
    </div>
    <section class="ats" aria-labelledby="ats-title">
      <h2 id="ats-title" data-w="check"></h2>
      <p class="hint" data-w="checkIntro"></p>
      <ul class="checks" id="checks"></ul>
      <div class="kw"><h3 data-w="found"></h3><p class="chips" id="kw-found"></p><h3 data-w="missing"></h3><p class="chips miss" id="kw-missing"></p></div>
      <div class="notes" id="notes"></div>
    </section>
  </section>
</main>
<footer class="foot"><p>job.appdoivo.com</p></footer>
<script src="/vendor/pdf-lib.min.js"></script>
<script src="/vendor/docx.iife.js"></script>
<script src="/vendor/mammoth.browser.min.js"></script>
<script type="module" src="/app.js?v=1"></script>
</body>
</html>
