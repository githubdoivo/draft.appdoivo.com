<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- csp-meta: only this site's own scripts run (refresh with ~/bin/csp-meta after editing an inline script) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-V5qJba2Pfl34pHXr5tflSMB61vARUx4poZzLZG+ElkI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://job-api.appdoivo.com; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>draftdoivo · Your CV, Tailored to Every Job</title>
<meta name="description" content="Upload a CV and a job ad; get a CV and cover letter tailored to that job, built to pass applicant tracking systems.">
<meta property="og:title" content="draftdoivo · Your CV, Tailored to Every Job">
<meta property="og:description" content="A CV and cover letter shaped to each job, built to pass applicant tracking systems.">
<meta property="og:url" content="https://draft.appdoivo.com/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://draft.appdoivo.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3e9dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/job.css?v=12">
<link rel="stylesheet" href="/look.css?v=1">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="page">
<div class="shell">
<header class="top">
  <a class="brand" href="/" data-w="brand">draftdoivo</a>
  <span class="tools">
    <button class="mode" id="mode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg></button>
    <button class="acct" id="people-btn" type="button" data-w="ppTitle" hidden></button>
    <button class="acct" id="acct" type="button"></button>
    <button class="lang" id="lang" type="button">PT</button>
  </span>
</header>
<main>
  <section class="hero">
    <h1 data-w="tagline">Your CV, Tailored to Every Job</h1>
    <p class="intro" data-w="intro"></p>
    <p class="news"><b data-w="newTag"></b> <span data-w="newText"></span></p>
  </section>

  <!-- The machine: one box, one step at a time. Continue opens the next step only when
       this one is valid; Back returns to the one before. What it understood is shown
       under each input, and step 4 sums everything up before anything is spent. -->
  <form id="form" class="machine" novalidate aria-labelledby="step-title">
    <div class="m-head">
      <ol class="m-track" id="track" aria-hidden="true">
        <li data-for="1"><span data-w="tCv"></span></li><li data-for="2"><span data-w="tJob"></span></li><li data-for="3"><span data-w="tCompany"></span></li><li data-for="4"><span data-w="tGo"></span></li>
      </ol>
      <p class="m-count" id="step-count" aria-live="polite"></p>
    </div>

    <section class="panel" data-step="1">
      <h2 class="m-title" tabindex="-1" data-w="stepCv"></h2>
      <!-- One clear action: upload. Dropping a file works too (said only where a mouse can
           drag), and pasting is a quiet alternative underneath. -->
      <div class="drop" id="drop">
        <input type="file" id="cv-file" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" class="sr">
        <label for="cv-file" class="btn" id="cv-pick" data-w="choose"></label>
        <p class="hint" id="cv-status" aria-live="polite" data-w="cvHint"></p>
        <p class="hint drop-or" data-w="drop"></p>
      </div>
      <button type="button" class="link quiet" id="paste-toggle" data-w="pasteInstead" aria-expanded="false" aria-controls="cv-paste"></button>
      <div id="cv-paste" hidden>
        <label class="sr" for="cv-text" data-w="cvPaste"></label>
        <textarea id="cv-text" rows="9" maxlength="30000"></textarea>
        <p class="count" data-count="cv-text"></p>
      </div>
      <div class="read" id="read-cv" aria-live="polite"></div>
    </section>

    <section class="panel" data-step="2" hidden>
      <h2 class="m-title" tabindex="-1" data-w="stepJob"></h2>
      <label class="link-row" for="job-link"><span data-w="linkLabel"></span>
        <span class="link-input"><input id="job-link" type="url" inputmode="url" autocomplete="off" spellcheck="false" data-w-placeholder="linkPh"><button type="button" class="btn ghost" id="read-link" data-w="readLink"></button></span></label>
      <label class="f-label" for="job" data-w="jobTextLabel"></label>
      <textarea id="job" rows="9" maxlength="20000" aria-describedby="job-status"></textarea>
      <p class="count" data-count="job"></p>
      <p class="hint" id="job-status" aria-live="polite" data-w="jobHint"></p>
      <p class="hint contacts" id="contacts" hidden></p>
      <div class="read" id="read-job" aria-live="polite"></div>
    </section>

    <section class="panel" data-step="3" hidden>
      <h2 class="m-title" tabindex="-1"><label for="company" data-w="stepCompany"></label> <span class="opt" data-w="optional"></span></h2>
      <p class="hint" data-w="companyHint"></p>
      <textarea id="company" rows="6" maxlength="10000"></textarea>
      <p class="count" data-count="company"></p>
      <div class="read" id="read-company" aria-live="polite"></div>
    </section>

    <section class="panel" data-step="4" hidden>
      <h2 class="m-title" tabindex="-1" data-w="stepGo"></h2>
      <dl class="summary" id="summary"></dl>
      <!-- The review board: a cheap check before the paid CV. The person decides what is
           true and which changes to make; the full CV is then written with those choices. -->
      <div class="review" id="review" aria-live="polite">
        <p class="hint" data-w="checkCost"></p>
        <button type="button" class="btn ghost" id="check" data-w="checkBtn"></button>
      </div>
      <div class="opt-row">
        <label class="opt-label" for="model" data-w="model"></label>
        <div><select id="model"></select><p class="hint model-cost" id="model-cost"></p></div>
      </div>
      <p class="hint" data-w="privacy"></p>
      <p class="hint credit" id="credit" hidden></p>
    </section>

    <div class="m-foot">
      <button type="button" class="btn ghost" id="back" data-w="back" hidden></button>
      <span class="m-spacer"></span>
      <button type="button" class="btn ghost" id="skip" data-w="skip" hidden></button>
      <button type="button" class="btn" id="next" data-w="continue" disabled></button>
      <button type="submit" class="btn" id="tailor" data-w="tailor" hidden></button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
  <p class="example-line"><span data-w="exampleLead"></span> <button type="button" class="link" id="example" data-w="example"></button></p>

  <dialog id="sign-dialog" class="pass" aria-labelledby="sign-title">
    <h2 id="sign-title" data-w="signTitle"></h2>
    <p class="hint" id="sign-lead"></p>
    <label for="sign-name" data-w="signName"></label>
    <input id="sign-name" autocomplete="given-name" maxlength="40">
    <label for="sign-invite" data-w="signInvite"></label>
    <input id="sign-invite" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24" placeholder="ABCD-EFGH">
    <div class="sign-btns"><button type="button" class="btn" id="sign-create" data-w="signCreate"></button><button type="button" class="btn ghost" id="sign-have" data-w="signHave"></button></div>
    <p class="err" id="sign-err" role="status" hidden></p>
    <details class="owner"><summary data-w="signOwner"></summary>
      <form method="dialog" id="pass-form"><input id="pass" type="password" autocomplete="current-password" aria-label="Passcode"><p class="err" id="pass-err" hidden data-w="passWrong"></p><button class="btn ghost" value="ok" id="pass-ok" data-w="tailor"></button></form>
    </details>
    <button type="button" class="link quiet" id="sign-close" data-w="close"></button>
  </dialog>
  <dialog id="people" class="pass people" aria-labelledby="people-title">
    <h2 id="people-title" data-w="ppTitle"></h2>
    <p class="hint" data-w="ppLead"></p>
    <p class="err" id="pp-err" role="status" hidden></p>
    <h3 data-w="ppInvites"></h3>
    <button type="button" class="btn" id="pp-new" data-w="ppNew"></button>
    <ul class="pp-list" id="pp-invites"></ul>
    <h3 data-w="ppAccounts"></h3>
    <ul class="pp-list" id="pp-users"></ul>
    <div class="go"><span></span><button type="button" class="btn ghost" id="people-close" data-w="close"></button></div>
  </dialog>
  <dialog id="wallet" class="pass" aria-labelledby="wallet-title">
    <h2 id="wallet-title"></h2>
    <p class="wallet-left" id="wallet-left"></p>
    <p class="err" id="wallet-need" hidden></p>
    <h3 data-w="walletPrices"></h3>
    <ul class="prices" id="prices"></ul>
    <h3 data-w="walletPacks"></h3>
    <div class="packs" id="packs"></div>
    <p class="hint" data-w="packSoon"></p>
    <div class="go"><button type="button" class="link quiet" id="sign-out" data-w="signOut"></button><button type="button" class="btn ghost" id="wallet-close" data-w="close"></button></div>
  </dialog>

  <section id="result" class="result" hidden aria-labelledby="result-title">
    <h2 class="sr" id="result-title" data-w="tabCv"></h2>
    <p class="hint" id="result-note"></p>
    <div class="opt-row result-colour">
      <span class="opt-label" id="colour-label" data-w="colour"></span>
      <div class="swatches" role="radiogroup" aria-labelledby="colour-label" id="swatches"></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-cv" aria-controls="panel-cv" aria-selected="true" data-w="tabCv"></button>
      <button role="tab" id="tab-letter" aria-controls="panel-letter" aria-selected="false" data-w="tabLetter"></button>
      <button role="tab" id="tab-interview" aria-controls="panel-interview" aria-selected="false" data-w="tabInterview"></button>
    </div>
    <div class="panel" id="panel-cv" role="tabpanel" aria-labelledby="tab-cv">
      <div class="downloads"><button type="button" class="btn" data-dl="cv-pdf" data-w="dlPdf"></button><button type="button" class="btn ghost" data-dl="cv-docx" data-w="dlWord"></button></div>
      <div class="paper-wrap" id="cv-preview"></div>
    </div>
    <div class="panel" id="panel-letter" role="tabpanel" aria-labelledby="tab-letter" hidden>
      <div class="downloads"><button type="button" class="btn" data-dl="letter-pdf" data-w="dlPdf"></button><button type="button" class="btn ghost" data-dl="letter-docx" data-w="dlWord"></button></div>
      <div class="paper-wrap" id="letter-preview"></div>
    </div>
    <div class="panel" id="panel-interview" role="tabpanel" aria-labelledby="tab-interview" hidden>
      <p class="hint" data-w="interviewIntro"></p>
      <button type="button" class="btn" id="prep" data-w="prepBtn"></button>
      <p class="hint" id="prep-status" aria-live="polite"></p>
      <div id="prep-out"></div>
    </div>
    <section class="ats" aria-labelledby="ats-title">
      <h2 id="ats-title" data-w="check"></h2>
      <p class="hint" data-w="checkIntro"></p>
      <ul class="checks" id="checks"></ul>
      <div class="kw"><h3 data-w="found"></h3><p class="chips" id="kw-found"></p><h3 data-w="missing"></h3><p class="chips miss" id="kw-missing"></p></div>
      <div class="notes" id="notes"></div>
    </section>
  </section>
  <section class="apps" id="apps" aria-labelledby="apps-title" hidden>
    <h2 id="apps-title" data-w="appsTitle"></h2>
    <p class="hint" data-w="appsIntro"></p>
    <ul class="app-list" id="app-list"></ul>
  </section>
</main>
<footer class="foot"><p>draft.appdoivo.com</p></footer>
</div>
</div>
<script src="/frame.js"></script>
<script src="/vendor/pdf-lib.min.js"></script>
<script src="/vendor/docx.iife.js"></script>
<script src="/vendor/mammoth.browser.min.js?v=1.13.0"></script>
<script type="module" src="/app.js?v=12"></script>
</body>
</html>
