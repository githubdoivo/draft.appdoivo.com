# job-api: the private side of job.appdoivo.com. Holds the AI key, checks the
# passcode, keeps the monthly cap and the saved results. Deploy: npm run deploy.
# Secrets (never in this file): ANTHROPIC_API_KEY and PASSCODE, set in the Cloudflare
# dashboard (Workers > job-api > Settings > Variables and Secrets) or with wrangler secret put
name = "job-api"
routes = [{ pattern = "job-api.appdoivo.com", custom_domain = true }]
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MONTHLY_CAP_USD = "3"
DAILY_RUNS = "40"
ALLOWED_ORIGINS = "https://job.appdoivo.com,http://localhost:4182"

[[kv_namespaces]]
binding = "JOB"
id = "9cfe53c727c74ab199026e17efdc3cb3"
